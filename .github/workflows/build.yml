name: CI

on: [push, pull_request]

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The plugin must remain fully functional without its optional dependencies - ffmpeg-for-homebridge is optional and the plugin falls back to the system FFmpeg.
  # We simulate its absence by removing it after install rather than using --omit=optional, which would also strip the dev toolchain's own optional native
  # bindings (e.g. rolldown's platform binary used by vitest).
  build-without-optional:
    name: Node 22.x (without ffmpeg-for-homebridge)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Remove the optional FFmpeg package to exercise the system-FFmpeg fallback
        run: |
          rm -rf node_modules/ffmpeg-for-homebridge
          test ! -d node_modules/ffmpeg-for-homebridge

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
